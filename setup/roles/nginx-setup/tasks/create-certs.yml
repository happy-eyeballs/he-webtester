- name: Prepare certificate creation
  block:
    - name: Create certificate scripts directory
      ansible.builtin.file:
        path: '{{ happy_eyeballs.base_path }}/cert-scripts'
        owner: root
        group: root
        mode: '0755'
        state: directory

    - name: Copy auth scripts
      ansible.builtin.template:
        src: '{{ item }}.j2'
        dest: '{{ happy_eyeballs.base_path }}/cert-scripts/{{ item }}'
        owner: root
        group: root
        mode: '0755'
      with_items:
        - 'auth-hook-handler.sh'
        - 'auth-cleanup-handler.sh'

- name: Create certificates
  ansible.builtin.include_tasks: create-cert.yml
  vars:
    domains: '{{ item }}'
  loop:
    - '{{ happy_eyeballs_domains.v1 | join(",") }}'
    - '{{ happy_eyeballs_domains.v1_ipv6_only }},{{ happy_eyeballs_domains.v1_ipv4_only }}'
    - '{{ happy_eyeballs_domains.v2 }}'
    - '{{ happy_eyeballs_domains.v3_quic.http3 }}'
    - '{{ happy_eyeballs_domains.v3_quic.http3_https }}'
    - '{{ happy_eyeballs_domains.v3_quic.http3_altsvc }}'
    - '{{ happy_eyeballs_domains.v3_quic.http3_https_altsvc }}'
    - '{{ happy_eyeballs_domains.v3_quic.http3_only }}'
    - '{{ happy_eyeballs_domains.v3_quic.http3_only_https }}'

- name: Create certificate for webtester domain
  block:
    - name: Check if certificate for webtester domain already exists
      ansible.builtin.stat:
        path: '/etc/letsencrypt/live/{{ happy_eyeballs.webtester.domains | first }}/cert.pem'
      register: webtester_certificate

    - name: Issue certificate for webtester domain
      ansible.builtin.command:
        cmd: >-
          certbot certonly
          --nginx
          --noninteractive
          --agree-tos
          --email {{ certbot.email }}
          -d {{ happy_eyeballs.webtester.domains | join(',') }}
      changed_when: true
      when: not webtester_certificate.stat.exists
