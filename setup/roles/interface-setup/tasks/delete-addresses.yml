- name: Delete IPv4 addresses from webserver interface
  ansible.builtin.shell:
    cmd: 'ip a del {{ item }}/{{ happy_eyeballs.webserver.ipv4_net_mask }} dev {{ happy_eyeballs.webserver.interface }}'
  with_items:
    - '{{ happy_eyeballs.webserver.delays | map(attribute="ipv4") | list }}'
    - '{{ happy_eyeballs.webserver.ipv4_only_ip }}'
    - '{{ happy_eyeballs.webserver.http3.ipv4 }}'
    - '{{ happy_eyeballs.webserver.http3_only.ipv4 }}'

- name: Delete IPv6 addresses from webserver interface
  ansible.builtin.shell:
    cmd: 'ip a del {{ item }}/{{ happy_eyeballs.webserver.ipv6_net_mask }} dev {{ happy_eyeballs.webserver.interface }}'
  with_items:
    - '{{ happy_eyeballs.webserver.delays | map(attribute="ipv6") | list }}'
    - '{{ happy_eyeballs.webserver.ipv6_only_ip }}'
    - '{{ happy_eyeballs.webserver.http3.ipv6 }}'
    - '{{ happy_eyeballs.webserver.http3_only.ipv6 }}'

- name: Delete IPv4 addresses from namesever interface
  ansible.builtin.shell:
    cmd: 'ip a del {{ item }}/{{ happy_eyeballs.nameserver.ipv4_net_mask }} dev {{ happy_eyeballs.nameserver.interface }}'
  with_items:
    - '{{ happy_eyeballs.nameserver.ipv4 }}'

- name: Delete IPv6 addresses from namesever interface
  ansible.builtin.shell:
    cmd: 'ip a del {{ item }}/{{ happy_eyeballs.nameserver.ipv6_net_mask }} dev {{ happy_eyeballs.nameserver.interface }}'
  with_items:
    - '{{ happy_eyeballs.nameserver.ipv6 }}'
